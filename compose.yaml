# MySQL data is the mysql-data volume.
# Redis data is the redis-data volume (AOF). REDIS_HOST=redis in deploy/.env.

name: michicast

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-php: &php
  image: michicast:local
  restart: unless-stopped
  env_file:
    - deploy/.env
  volumes:
    - app-storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: *logging

services:
  app:
    <<: *php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    command: ["php-fpm"]

  web:
    image: michicast-web:local
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - app-storage:/var/www/storage:ro
    logging: *logging

  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600", "--memory=128"]
    stop_grace_period: 30s
    init: true

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    init: true

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - deploy/.env
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=30
      - --disable-log-bin
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-redo-log-capacity=67108864
      - --table-open-cache=64
      - --skip-name-resolve
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - deploy/.env
    # Internal Compose network only -- no ports: published to the host.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *logging

volumes:
  mysql-data:
  redis-data:
  app-storage:
