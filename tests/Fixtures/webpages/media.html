<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example News</title>
</head>
<body>
  <main class="news-list">
    <article class="news-item">
      <h2 class="title"><a href="/news/riverside-park">City opens the riverside park</a></h2>
      <img class="cover" src="/images/riverside-park.jpg" alt="The riverside park" width="1200" height="630">
      <img class="cover" src="https://cdn.example.com/park-gate.png">
      <img class="avatar" src="/images/author.png" alt="Author">
      <a class="read-more" href="/news/riverside-park">Read more</a>
    </article>
    <article class="news-item">
      <h2 class="title"><a href="/news/library-reopens">Library wing reopens</a></h2>
      <figure class="cover">
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="images/library.webp" alt="The west wing">
      </figure>
      <img class="cover" src="javascript:alert(1)">
      <a class="read-more" href="/news/library-reopens">Read more</a>
    </article>
    <article class="news-item">
      <h2 class="title"><a href="/news/tram-line">New tram line approved</a></h2>
      <a class="read-more" href="/news/tram-line">Read more</a>
    </article>
  </main>
</body>
</html>
