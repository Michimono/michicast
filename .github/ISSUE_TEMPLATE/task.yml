name: Task
description: A concrete piece of work that is not a bug or feature.
title: "[Task]: "
labels: ["task"]
type: Task
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done?
      placeholder: Short description of the task.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How will we know this is finished?
    validations:
      required: false
