map $uri $michicast_csp {
    default "default-src 'self' http: https: data: blob;";
    # Horizon (and later Pulse #158) ship inline script/style; loosen only those paths.
    ~^/admin/(horizon|pulse) "default-src 'self' http: https: data: blob; script-src 'self' 'unsafe-inline' http: https: data: blob; style-src 'self' 'unsafe-inline' http: https: data: blob;";
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    client_max_body_size 12m;

    # Strict CSP everywhere except /admin/horizon and /admin/pulse (map above).
    add_header Content-Security-Policy $michicast_csp always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /build/ {
        expires 1y;
        try_files $uri =404;
    }

    # Public disk. The symlink in public/storage does not cross containers.
    location /storage/ {
        alias /var/www/storage/app/public/;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
}